services:
  # =========================
  # Postgres per APP (tuo prodotto)
  # =========================
  postgres_app:
    image: postgres:16
    container_name: techops-postgres-app
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_app:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  # =========================
  # Postgres per N8N (solo n8n)
  # =========================
  postgres_n8n:
    image: postgres:16
    container_name: techops-postgres-n8n
    environment:
      POSTGRES_DB: ${POSTGRES_N8N_DB}
      POSTGRES_USER: ${POSTGRES_N8N_USER}
      POSTGRES_PASSWORD: ${POSTGRES_N8N_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_n8n:/var/lib/postgresql/data

  # =========================
  # MinIO (S3)
  # =========================
  minio:
    image: minio/minio:latest
    container_name: techops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # =========================
  # n8n
  # =========================
  n8n:
    image: n8nio/n8n:latest
    container_name: techops-n8n
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_N8N_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_N8N_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_N8N_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_DIAGNOSTICS_ENABLED: "false"

    depends_on:
      - postgres_n8n
    volumes:
      - n8n_data:/home/node/.n8n

  # =========================
  # API
  # =========================
  api:
    build: ./services/api
    container_name: techops-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_KEY: ${API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - postgres_app
      - minio

volumes:
  pgdata_app:
  pgdata_n8n:
  miniodata:
  n8n_data:
